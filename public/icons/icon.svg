<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fundo -->
  <rect width="512" height="512" rx="96" fill="#0a0f1e"/>

  <!-- Estrelas -->
  <circle cx="80"  cy="70"  r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="440" cy="90"  r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="60"  cy="400" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="460" cy="380" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="130" cy="440" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="400" cy="440" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="490" cy="210" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="30"  cy="260" r="2" fill="#ffffff" opacity="0.5"/>

  <!-- Planeta (Saturno estilizado) -->
  <ellipse cx="256" cy="256" rx="110" ry="110" fill="#c09050"/>
  <!-- Faixas do planeta -->
  <ellipse cx="256" cy="230" rx="108" ry="22" fill="#b07840" opacity="0.7"/>
  <ellipse cx="256" cy="270" rx="109" ry="18" fill="#d0a860" opacity="0.5"/>
  <!-- Anel -->
  <ellipse cx="256" cy="256" rx="175" ry="40" fill="none" stroke="#e8d090" stroke-width="18" opacity="0.75"/>
  <!-- Sombra do anel atrás do planeta (recorte) -->
  <ellipse cx="256" cy="256" rx="110" ry="110" fill="#c09050"/>
  <!-- Faixas novamente sobre a sombra do anel -->
  <ellipse cx="256" cy="230" rx="108" ry="22" fill="#b07840" opacity="0.7"/>
  <ellipse cx="256" cy="270" rx="109" ry="18" fill="#d0a860" opacity="0.5"/>
  <!-- Brilho polar -->
  <ellipse cx="256" cy="200" rx="60" ry="30" fill="#f0d090" opacity="0.25"/>

  <!-- Foguete pequeno no canto superior direito -->
  <g transform="translate(390,80) rotate(45)">
    <!-- Corpo -->
    <rect x="-10" y="-28" width="20" height="40" rx="10" fill="#e8eef7"/>
    <!-- Nariz -->
    <polygon points="0,-42 -10,-28 10,-28" fill="#7dd3fc"/>
    <!-- Chama -->
    <ellipse cx="0" cy="20" rx="8" ry="14" fill="#ff8833" opacity="0.9"/>
    <ellipse cx="0" cy="22" rx="4" ry="8"  fill="#ffe066" opacity="0.9"/>
    <!-- Aletas -->
    <polygon points="-10,8 -22,20 -10,20" fill="#7dd3fc"/>
    <polygon points=" 10,8  22,20  10,20" fill="#7dd3fc"/>
  </g>

  <!-- Letra B grande como marca opcional (removida para ficar clean) -->
</svg>
